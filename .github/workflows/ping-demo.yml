name: Ping Streamlit Demo

on:
  schedule:
    # At minute 0 past every 10th hour (UTC): 0 0,10,20 * * * -> shorthand: 0 */10 * * *
    - cron: '0 */10 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    name: Ping demo site
    runs-on: ubuntu-latest
    steps:
      - name: Curl demo URL
        run: |
          set -e
          URL="https://ai-it-support-assistant-demo.streamlit.app/"
          echo "Pinging $URL"
          # Retry a few times to tolerate transient errors
          curl -fsS --retry 3 --retry-delay 10 "$URL" > /dev/null
          echo "Ping succeeded"
